<circle cx="18" cy="14" r="5.5" fill="#ff5f57"/><circle cx="36" cy="14" r="5.5" fill="#febc2e"/><circle cx="54" cy="14" r="5.5" fill="#28c840"/>
<text class="t dim" x="496" y="18.5" text-anchor="middle">qemu-system-x86_64 — Kalkan (test kernel)</text>
<text class="t l l0" x="18" y="52"><tspan class="hi">Kalkan v0.2.0 booting</tspan></text>
<text class="t l l1" x="18" y="69"><tspan class="dim">[boot]</tspan> bootloader: Limine 11.2.1</text>
<text class="t l l2" x="18" y="86"><tspan class="hi">Security posture:</tspan></text>
<text class="t l l3" x="18" y="103">  <tspan class="ok">[PASS]</tspan> NX (no-execute pages)                  EFER.NXE</text>
<text class="t l l4" x="18" y="120">  <tspan class="ok">[PASS]</tspan> SMEP (no kernel exec of user pages)    CR4.SMEP</text>
<text class="t l l5" x="18" y="137">  <tspan class="ok">[PASS]</tspan> SMAP (no kernel access to user pages)  CR4.SMAP, never lifted</text>
<text class="t l l6" x="18" y="154">  <tspan class="ok">[PASS]</tspan> UMIP (hide descriptor tables)          CR4.UMIP</text>
<text class="t l l7" x="18" y="171">  <tspan class="ok">[PASS]</tspan> W^X kernel image                       .text R-X, .rodata R--, .data RW-</text>
<text class="t l l8" x="18" y="188">  <tspan class="ok">[PASS]</tspan> KASLR (kernel image)                   slide 0x52cf2000</text>
<text class="t l l9" x="18" y="205">Boot module integrity (BLAKE2b-512):</text>
<text class="t l l10" x="18" y="222">  <tspan class="ok">[PASS]</tspan> init      257672 bytes  2c1ba5134cd341d0...</text>
<text class="t l l11" x="18" y="239">  <tspan class="ok">[PASS]</tspan> sandbox   226736 bytes  21060fc06f774ce7...</text>
<text class="t l l12" x="18" y="256"><tspan class="dim">[mm]</tspan> kernel page tables active; direct map at 0xffffd1bec0000000; local APIC in x2APIC mode</text>
<text class="t l l13" x="18" y="273"><tspan class="dim">[kernel]</tspan> root task &#x27;init&#x27; ready with 127 initial capabilities; &#x27;sandbox&#x27; and 60 probe processes created (inactive); test kernel</text>
<text class="t l l14" x="18" y="290"><tspan class="sb">[sandbox]</tspan>   <tspan class="ok">[BLOCKED]</tspan> forge a different badge (identity spoofing) (EINVAL)</text>
<text class="t l l15" x="18" y="307"><tspan class="sb">[sandbox]</tspan>   <tspan class="ok">[BLOCKED]</tspan> smuggle a capability over IPC (its console capability)</text>
<text class="t l l16" x="18" y="324"><tspan class="sb">[sandbox]</tspan>   <tspan class="ok">[BLOCKED]</tspan> kill the root task without a thread capability (EEMPTY)</text>
<text class="t l l17" x="18" y="341"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> sandbox escape attempts all refused (67 checks passed, 0 failed)</text>
<text class="t l l18" x="18" y="358"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> read kernel code (killed: page fault at 0xffffffffd2cf2000, error 0x5)</text>
<text class="t l l19" x="18" y="375"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> overwrite the kernel stack (killed: page fault at 0xfffffbae2e610ff8, error 0x7)</text>
<text class="t l l20" x="18" y="392"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> read the kernel through the direct map of physical memory (killed: page fault at 0xffffd1becbfc2000, error 0x5)</text>
<text class="t l l21" x="18" y="409"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> redirect the system call entry (wrmsr LSTAR) (killed: general protection fault)</text>
<text class="t l l22" x="18" y="426"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> iretq into ring 0 (killed: general protection fault)</text>
<text class="t l l23" x="18" y="443"><tspan class="pr">[probe53]</tspan>   fuzzer: 24000 system calls, 1305 succeeded, errors by code […]</text>
<text class="t l l24" x="18" y="460"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> a server that dies holding a call releases its caller (the call returned EDEAD)</text>
<text class="t l l25" x="18" y="477"><tspan class="init">[init]</tspan>   <tspan class="ok">[PASS]</tspan> kill a process blocked in IPC (removed from the endpoint queue, everything reclaimed)</text>
<text class="t l l26" x="18" y="494"><tspan class="init">[init]</tspan> <tspan class="ok">KALKAN-TEST: PASS</tspan> - all 143 security tests passed</text>
<text class="t l l27" x="18" y="511"><tspan class="dim">[kernel]</tspan> audit: object graph consistent (…); 44890 audits passed, 702 with a full page-table walk</text>
<text class="t l l28" x="18" y="528"><tspan class="dim">[kernel]</tspan> system shut down cleanly</text>
</svg>
