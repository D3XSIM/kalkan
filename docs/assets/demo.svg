<svg xmlns="http://www.w3.org/2000/svg" width="992" height="549" viewBox="0 0 992 549" role="img" aria-labelledby="title desc">
<title id="title">Kalkan boots and runs its adversarial security suite</title>
<desc id="desc">A test kernel checks its hardware protections and boot modules, then untrusted processes attack it: every attack is blocked and all 143 security tests pass.</desc>
<style>.t{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre;fill:#c9d1d9}.dim{fill:#8b949e}.ok{fill:#3fb950;font-weight:600}.init{fill:#58a6ff}.sb{fill:#39c5cf}.pr{fill:#bc8cff}.hi{fill:#f0f6fc;font-weight:600}.l{animation-duration:16.4s;animation-iteration-count:infinite;animation-timing-function:linear}@keyframes k0{0%,2.44%{opacity:0}2.45%,97%{opacity:1}100%{opacity:0}}.l0{animation-name:k0}@keyframes k1{0%,3.97%{opacity:0}3.98%,97%{opacity:1}100%{opacity:0}}.l1{animation-name:k1}@keyframes k2{0%,6.11%{opacity:0}6.12%,97%{opacity:1}100%{opacity:0}}.l2{animation-name:k2}@keyframes k3{0%,7.02%{opacity:0}7.03%,97%{opacity:1}100%{opacity:0}}.l3{animation-name:k3}@keyframes k4{0%,7.94%{opacity:0}7.95%,97%{opacity:1}100%{opacity:0}}.l4{animation-name:k4}@keyframes k5{0%,8.86%{opacity:0}8.87%,97%{opacity:1}100%{opacity:0}}.l5{animation-name:k5}@keyframes k6{0%,9.78%{opacity:0}9.79%,97%{opacity:1}100%{opacity:0}}.l6{animation-name:k6}@keyframes k7{0%,10.69%{opacity:0}10.70%,97%{opacity:1}100%{opacity:0}}.l7{animation-name:k7}@keyframes k8{0%,11.61%{opacity:0}11.62%,97%{opacity:1}100%{opacity:0}}.l8{animation-name:k8}@keyframes k9{0%,13.45%{opacity:0}13.46%,97%{opacity:1}100%{opacity:0}}.l9{animation-name:k9}@keyframes k10{0%,14.36%{opacity:0}14.37%,97%{opacity:1}100%{opacity:0}}.l10{animation-name:k10}@keyframes k11{0%,15.28%{opacity:0}15.29%,97%{opacity:1}100%{opacity:0}}.l11{animation-name:k11}@keyframes k12{0%,17.42%{opacity:0}17.43%,97%{opacity:1}100%{opacity:0}}.l12{animation-name:k12}@keyframes k13{0%,20.17%{opacity:0}20.18%,97%{opacity:1}100%{opacity:0}}.l13{animation-name:k13}@keyframes k14{0%,23.84%{opacity:0}23.85%,97%{opacity:1}100%{opacity:0}}.l14{animation-name:k14}@keyframes k15{0%,26.60%{opacity:0}26.61%,97%{opacity:1}100%{opacity:0}}.l15{animation-name:k15}@keyframes k16{0%,29.35%{opacity:0}29.36%,97%{opacity:1}100%{opacity:0}}.l16{animation-name:k16}@keyframes k17{0%,33.02%{opacity:0}33.03%,97%{opacity:1}100%{opacity:0}}.l17{animation-name:k17}@keyframes k18{0%,36.69%{opacity:0}36.70%,97%{opacity:1}100%{opacity:0}}.l18{animation-name:k18}@keyframes k19{0%,39.44%{opacity:0}39.45%,97%{opacity:1}100%{opacity:0}}.l19{animation-name:k19}@keyframes k20{0%,42.19%{opacity:0}42.20%,97%{opacity:1}100%{opacity:0}}.l20{animation-name:k20}@keyframes k21{0%,44.94%{opacity:0}44.95%,97%{opacity:1}100%{opacity:0}}.l21{animation-name:k21}@keyframes k22{0%,47.70%{opacity:0}47.71%,97%{opacity:1}100%{opacity:0}}.l22{animation-name:k22}@keyframes k23{0%,51.98%{opacity:0}51.99%,97%{opacity:1}100%{opacity:0}}.l23{animation-name:k23}@keyframes k24{0%,55.65%{opacity:0}55.66%,97%{opacity:1}100%{opacity:0}}.l24{animation-name:k24}@keyframes k25{0%,58.40%{opacity:0}58.41%,97%{opacity:1}100%{opacity:0}}.l25{animation-name:k25}@keyframes k26{0%,63.29%{opacity:0}63.30%,97%{opacity:1}100%{opacity:0}}.l26{animation-name:k26}@keyframes k27{0%,66.96%{opacity:0}66.97%,97%{opacity:1}100%{opacity:0}}.l27{animation-name:k27}@keyframes k28{0%,69.41%{opacity:0}69.42%,97%{opacity:1}100%{opacity:0}}.l28{animation-name:k28}@media (prefers-reduced-motion:reduce){.l{animation:none}}</style>
