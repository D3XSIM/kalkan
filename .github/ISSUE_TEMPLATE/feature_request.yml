name: Feature or improvement
description: Propose a feature, a hardening measure or a new test.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or could be stronger, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. If it touches security, how would we test that misuse is refused?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
