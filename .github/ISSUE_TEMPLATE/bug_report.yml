name: Bug report
description: Something does not build, boot or behave as documented (not a security issue).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems go to the [private report form](https://github.com/D3XSIM/kalkan/security/advisories/new), not here.**
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Serial log or command output
      description: The relevant part of the output (for example `target/kalkan-test.log`).
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or a commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, QEMU version, CPU model passed to QEMU, or the real machine.
      placeholder: Ubuntu 24.04, QEMU 9.2, -cpu max
