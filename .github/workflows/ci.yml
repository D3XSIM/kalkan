name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: catch new advisories and toolchain issues

# Least privilege for the workflow token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, Clippy, static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy -p kalkan-core -p xtask --all-targets -- -D warnings
      - run: cargo clippy -p kalkan-kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p kalkan-kernel --target x86_64-unknown-none --features qemu-exit,audit -- -D warnings
      - run: cargo clippy -p kalkan-kernel --target x86_64-unknown-none --features qemu-exit,audit,selftest -- -D warnings
      - run: cargo clippy -p libkalkan -p kalkan-init -p kalkan-sandbox --target x86_64-unknown-none -- -D warnings
      - name: Static checks of the security claims (dependencies, unsafe, CI pinning)
        run: cargo xtask check

  unit-tests:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Unit, property and differential tests
        run: cargo test -p kalkan-core -p xtask
      - name: Stress tests (millions of model steps and parser mutations)
        run: cargo test -p kalkan-core --release -- --ignored

  qemu:
    name: Whole-system security scenarios (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - run: rustup toolchain install
      - name: Adversarial suite, randomisation, fail-closed and tamper scenarios
        run: cargo xtask test
      - name: Keep the serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-logs
          path: target/kalkan-*.log
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (ELF validator, capability database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the ELF validator
        working-directory: fuzz
        run: cargo +nightly fuzz run elf -- -max_total_time=120
      - name: Fuzz the capability database
        working-directory: fuzz
        run: cargo +nightly fuzz run cspace -- -max_total_time=120

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
