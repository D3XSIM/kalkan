name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: catch new advisories and toolchain issues

# Least privilege for the workflow token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy -p kalkan-core -p xtask --all-targets -- -D warnings
      - run: cargo clippy -p kalkan-kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p libkalkan -p kalkan-init -p kalkan-sandbox --target x86_64-unknown-none -- -D warnings

  unit-tests:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test -p kalkan-core

  qemu:
    name: Boot + security test suite (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - run: rustup toolchain install
      - name: Security suite and tamper test
        run: cargo xtask test

  fuzz:
    name: Fuzz (ELF validator, capability database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the ELF validator
        working-directory: fuzz
        run: cargo +nightly fuzz run elf -- -max_total_time=120
      - name: Fuzz the capability database
        working-directory: fuzz
        run: cargo +nightly fuzz run cspace -- -max_total_time=120

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
