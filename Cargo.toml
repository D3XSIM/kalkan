[workspace]
resolver = "3"
members = [
    "kcore",
    "kernel",
    "user/libkalkan",
    "user/init",
    "user/sandbox",
    "xtask",
]
# `cargo test` / `cargo clippy` at the workspace root only touch host crates.
# Freestanding crates are built through `cargo xtask` (see docs/BUILDING.md).
default-members = ["kcore", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/D3XSIM/kalkan"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"
trivial_casts = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow"
missing_safety_doc = "deny"
indexing_slicing = "allow"

[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
# Integer overflow is a security bug, not a performance knob.
overflow-checks = true
debug-assertions = false
opt-level = 2
lto = "thin"
codegen-units = 1
debug = 1
