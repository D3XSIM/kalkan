[alias]
xtask = "run --quiet --package xtask --"

[target.x86_64-unknown-none]
# Relocations are applied by the loader (Limine for the kernel, the kernel for
# user programs) *before* final page permissions are set, so a separate
# PT_GNU_RELRO segment is not needed: every relocated read-only section lives in
# the read-only PT_LOAD segment and is never writable at runtime.
rustflags = ["-C", "relro-level=off", "-C", "force-frame-pointers=yes"]
